# Jarvis Mode - Motion Trigger Automation
# Add this to your Home Assistant automations.yaml or create via UI
#
# This calls the Clawdbot gateway webhook directly when motion is detected.
# The Jarvis server (8088) handles cooldown checks before forwarding.

# =============================================================================
# STEP 1: Add to configuration.yaml
# =============================================================================

rest_command:
  jarvis_motion:
    url: "http://192.168.1.X:8088/webhook/motion/{{ room }}"
    method: POST
    content_type: "application/json"
    payload: '{"room": "{{ room }}"}'

# =============================================================================
# STEP 2: Create automation (via UI or automations.yaml)
# =============================================================================

alias: "Jarvis Motion Trigger"
description: "Notify Jarvis when motion detected on cameras"
mode: single

trigger:
  - platform: state
    entity_id:
      - binary_sensor.kitchen_person_detected
      - binary_sensor.living_room_person_detected
      - binary_sensor.dining_person_detected
    from: "off"
    to: "on"

action:
  - service: rest_command.jarvis_motion
    data:
      room: >-
        {{ trigger.entity_id | replace('binary_sensor.', '') | replace('_person_detected', '') }}

# =============================================================================
# ALTERNATIVE: Call Clawdbot gateway directly (bypasses Jarvis cooldowns)
# =============================================================================
# If you want HA to call Clawdbot directly (skipping the Jarvis server):
