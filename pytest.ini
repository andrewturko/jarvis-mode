[pytest]
# Pytest configuration for Jarvis Mode

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Coverage options (if pytest-cov installed)
# --cov=scripts
# --cov-report=term-missing
# --cov-report=html

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may call external services)
    slow: Slow-running tests
    requires_ha: Tests that require Home Assistant connection

# Logging
log_cli = false
log_cli_level = INFO
